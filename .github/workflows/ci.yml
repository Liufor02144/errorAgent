name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test backend
        run: mvn --batch-mode --no-transfer-progress test
      - name: Build executable jar and frontend
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify frontend is packaged
        run: jar tf target/erroragent-*.jar | grep -q 'BOOT-INF/classes/static/index.html'

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: erroragent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
